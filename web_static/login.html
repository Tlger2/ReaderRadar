<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReaderRadar — Sign in</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:system-ui,sans-serif;
     display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:12px;
      padding:40px 36px;width:340px}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:1.4rem;font-weight:600;color:#fff;letter-spacing:.5px}
.logo span{color:#00d4ff}
label{display:block;font-size:.8rem;color:#888;margin-bottom:4px;margin-top:16px}
input{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;
      color:#e0e0e0;font-size:.95rem;padding:9px 12px;outline:none;transition:border .15s}
input:focus{border-color:#00d4ff}
.btn{width:100%;margin-top:24px;padding:10px;background:#00d4ff;border:none;
     border-radius:6px;color:#000;font-size:.95rem;font-weight:600;cursor:pointer;
     transition:opacity .15s}
.btn:hover{opacity:.85}
.err{color:#ff5555;font-size:.8rem;margin-top:12px;text-align:center;min-height:1.2em}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1><span>Reader</span>Radar</h1>
    <div style="font-size:.75rem;color:#555;margin-top:4px">private access</div>
  </div>
  <form method="post" action="/login" id="frm">
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
<script>
const p = new URLSearchParams(location.search);
if(p.get('err')) document.getElementById('err').textContent = 'Invalid credentials.';
</script>
</body>
</html>
